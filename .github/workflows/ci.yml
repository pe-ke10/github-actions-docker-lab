name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application with Maven
        run: mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-docker-lab-jar
          path: target/*.jar

      - name: Build Docker image
        run: docker build -t ghcr.io/pe-ke10/github-actions-docker-lab:latest .

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u pe-ke10 --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/pe-ke10/github-actions-docker-lab:latest